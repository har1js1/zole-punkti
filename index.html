<!doctype html><html lang="lv"><head><meta charset="utf-8"><title>Zole</title>
<meta name="theme-color" content="#0a191e"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Isometra&display=swap">
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a191e;--fg:#eaf1ee;--card:#12292f;--ac:#4a9878;--on:#0a191e;--gd:#d8b65c;--mu:#8ea8a6;--bd:#21424a;--neg:#ff8a7e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
h1{margin:6px 0 2px}h3{margin:0 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:4px 4px 4px 0;min-height:46px;cursor:pointer}
button:disabled{opacity:.45}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.big{display:block;width:100%;text-align:left;margin:8px 0;padding:16px}
input,textarea,select{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:11px;margin:4px 0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px}.bar b{flex:1;font-size:18px}
.sb{display:flex;gap:8px}.sb>div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.sb b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}.sb span{font-size:30px;font-weight:700}
.n{color:var(--neg)}.h{padding:8px 0;border-bottom:1px solid var(--bd)}
.lbl{margin:10px 0 2px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;background:var(--ac);color:var(--on);border-radius:99px;padding:4px 12px;font-weight:600;margin:4px 6px 4px 0}
.tv{padding:22px}.tv h1{font-size:clamp(28px,4vw,52px)}
.cols{column-width:420px;column-gap:20px}
.row{break-inside:avoid;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:0 0 10px;font-size:clamp(20px,2.4vw,34px)}
.row .r{width:2.2em;font-weight:800;color:var(--ac)}.row .p{flex:1}.row small{font-size:.5em}.row .s{font-weight:800}
.g1 .r{font-size:1.3em}
.sb .hd{display:block;font-size:18px;font-weight:400;line-height:1;padding:4px 0 6px;touch-action:none;cursor:grab;user-select:none;color:var(--mu)}
.up{color:#2fb36b;font-size:.6em}.dn{color:var(--neg);font-size:.6em}
.tv{padding:12px}.tv .row{margin:0;font-size:inherit;padding:0 14px}.tv .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:var(--bg)}
.hd{font-size:22px;touch-action:none;cursor:grab;padding:0 8px;user-select:none}
h1{color:var(--gd)}summary{color:var(--gd);cursor:pointer}
.row .r{color:var(--gd)}.row .s{color:var(--gd)}.row .s.n{color:var(--neg)}
.chip{background:var(--gd);color:#0a191e}
.sb span{color:var(--gd)}.sb span.n{color:var(--neg)}
.up{color:var(--ac)}
button.pri{color:#0a191e}
.pp{display:inline-flex;flex-direction:column;align-items:center;min-width:68px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:4px 12px;margin:6px 6px 0 0}.pp span{font-size:14px;color:var(--fg)}.pp b{font-size:22px;color:var(--ac)}.pp b.n{color:var(--neg)}
.row.out{opacity:.55}
.sb>div{cursor:pointer}.sb>div.dl{border-color:var(--gd);box-shadow:0 0 0 2px var(--gd),0 0 18px 4px rgba(216,182,92,.55)}
.danger{background:#b3392f;border-color:#b3392f;color:#fff;font-weight:600}
.bigtm{font-size:52px;font-weight:800;color:var(--gd);line-height:1.15}
.g2{display:flex;justify-content:space-between;gap:10px;line-height:1.5}
.row .sm{font-size:.55em;color:var(--mu);width:3.6em;text-align:right}.row .sm.n{color:var(--neg)}
.lbl.chg{color:var(--gd);font-weight:700}.chg:not(.lbl){border-color:var(--gd)!important;background:rgba(216,182,92,.18)}
.ar{display:inline-block;width:1.2em;text-align:center}.ar .up,.ar .dn{font-size:1em;font-weight:700}
.w.wide{max-width:none;padding:0}
.h.last{background:rgba(216,182,92,.13);border-left:3px solid var(--gd);padding-left:9px;border-radius:6px}
/* ---- vizuālais uzlabojums ---- */
body{background:radial-gradient(900px 520px at 50% -8%,#17423f 0%,rgba(10,25,30,0) 70%) fixed,#0a191e;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h3,.bar b,.hero h1{font-family:'Isometra','Inter',system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
.hero{text-align:center;padding:30px 0 14px}.hero h1{font-size:60px;margin:0;line-height:1.05;text-shadow:0 2px 22px rgba(216,182,92,.28)}.hero p{margin:6px 0 0;color:var(--mu)}
.suits{font-size:22px;letter-spacing:.55em;color:var(--ac);padding-left:.55em}
.card{background:linear-gradient(180deg,#143139,#102a31);border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
button{border-radius:14px;background:#133038;transition:transform .08s,border-color .15s}button:active{transform:scale(.97)}
button.on,button.pri{background:linear-gradient(180deg,#5bb690,#3f8a6b);border-color:#5bb690;color:#06140f;font-weight:700;box-shadow:none}
button.big{border-radius:18px;padding:18px 20px;background:linear-gradient(180deg,#143139,#102a31);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:18px}
button.big.pri{background:linear-gradient(180deg,#5bb690,#3f8a6b)}
button.big small{font-size:13px;font-weight:400;opacity:.85}.big .ic{display:inline-block;width:1.7em;font-size:1.15em;text-align:center;color:var(--gd)}.big.pri .ic{color:#06140f}
button.danger{background:linear-gradient(180deg,#cb4a3d,#a53329);border-color:#cb4a3d;color:#fff}
input,textarea,select{border-radius:12px;background:#0b1f25}input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.bar b{font-size:20px;color:var(--gd)}.bar>button:first-child{width:44px;padding:0;border-radius:50%;flex:none}
.sb>div{border-radius:18px;background:linear-gradient(180deg,#163740,#112b32);box-shadow:0 6px 16px rgba(0,0,0,.3);padding:12px 8px}
.sb span{font-size:36px;font-variant-numeric:tabular-nums}.sb .hd{font-size:18px}
.row{background:linear-gradient(90deg,#143139,#102a31);border-radius:16px}
.row.r1{box-shadow:inset 6px 0 0 #d8b65c}.row.r2{box-shadow:inset 6px 0 0 #b9c4c6}.row.r3{box-shadow:inset 6px 0 0 #c8855a}
.pp{border-radius:12px;background:#0b1f25}.chip{border-radius:99px}
.ver{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mu)}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const VERSION='3.9';
const fmt=n=>(n>0?'+':'')+(Math.round(n*10)/10);
// Punkti: [nosaukums, punkti spēlētājam]; pretinieki saņem pretējo zīmi (pusi vai visu).
const BASE={"Lielais":[["Uzvara 61–90",2],["Uzvara 91+ (jaņi)",4],["Uzvara visi stiķi",6],["Zaudējums 31–60",-4],["Zaudējums ≤30",-6],["Zaudējums, nav stiķu",-8]],
"Zole":[["Uzvara 61–90",10],["Uzvara 91+ (jaņi)",12],["Uzvara visi stiķi",14],["Zaudējums 31–60",-12],["Zaudējums ≤30",-14],["Zaudējums, nav stiķu",-16]],
"Mazā zole":[["Uzvara",12],["Zaudējums",-14]],
"Galdiņš":[["Zaudētājs",-4]]};
const mk=(m,...k)=>({mode:m,opp:0.5,games:Object.fromEntries(k.map(x=>[x,BASE[x]]))});
const PRE={MG:mk('MG','Lielais','Zole','Mazā zole','Galdiņš'),G:mk('G','Lielais','Zole','Galdiņš'),P:mk('P','Lielais','Zole','Mazā zole')};
const DEF=PRE.MG;
const R=()=>(view==='solo'?solo.rules:cfg&&cfg.rules)||DEF;
const GM=()=>Object.assign({},R().games,R().mode==='P'?{"Pule":[]}:{},{"Custom":[]});
const gl=g=>g==='Custom'?'Cits (ievadi pats)':g==='Pule'?'Visi nopasē (pule)':g;
const pool=rs=>rs.reduce((a,r)=>a+(r.pl||0),0);
const LV=new Intl.DateTimeFormat();
let SRV=true,adm={},ending=false,cfg=null,rounds=[],view='home',H=null,tbl=null,cur=null,list=[],jsel=null,es=null,solos=ls.get('solos',null)||[ls.get('solo',{players:[],rounds:[]}),ls.get('solo2',{players:[],rounds:[]})],sc=ls.get('sc',0),solo=solos[sc]||(sc=0,solos[0]),myT=ls.get('myT',{});
setInterval(tick,1000);setInterval(()=>{if(view==='home')loadList()},4000);
const hr=()=>render();
const api=(p,m,b,host)=>{const t=myT[cur]||{};return fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Token':t.token||'','X-Host':host&&t.host?t.host:''},body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error(r.status===403?'nav atļaujas':'servera kļūda '+r.status);return r.json().catch(()=>({}))})};
function openT(){closeT();const m=myT[cur];if(!m)return;cfg=null;rounds=[];
 es=new EventSource('/events?t='+cur+'&k='+m.token);
 es.onmessage=e=>{const d=JSON.parse(e.data);if(d.gone||d.type==='gone'){delete myT[cur];ls.set('myT',myT);if(!ending)alert('Turnīrs ir beidzies.');ending=false;go('home');return}if(d.type==='add'){if(!rounds.some(r=>r.id===d.round.id))rounds.push(d.round)}else if(d.type==='del'){rounds=rounds.filter(r=>r.id!==d.id)}else if(d.type==='cfg'){cfg=d.cfg&&d.cfg.limit?d.cfg:null}else{cfg=d.cfg&&d.cfg.limit?d.cfg:null;rounds=d.rounds||[]}hr()}}
function closeT(){if(es){es.close();es=null}}
function loadList(){fetch('/api/list').then(r=>{if(!r.ok||!/json/.test(r.headers.get('content-type')||''))throw 0;return r.json()}).then(l=>{SRV=true;list=l;if(view==='home'&&!jsel)render()}).catch(()=>{if(SRV){SRV=false;if(view==='home')render()}})}
function enterT(t){cur=t;tbl=ls.get('tbl_'+t,null);openT();go('tmenu')}
function go(v){if(!['tmenu','table','tv','host','stats'].includes(v)){closeT();cur=null;cfg=null;rounds=[]}if(v!=='admin')adm={};view=v;H=null;ordEd=false;if(v==='home'){jsel=null;loadList()}render();scrollTo(0,0)}
function render(){const f={home:homeV,solo:soloV,tv:tvV,table:tableV,host:hostV,tcreate:createV,tmenu:menuV,stats:statsV,admin:adminV}[view];$('#app').className=view==='tv'?'w wide':'w';$('#app').innerHTML=f();tick()}
const hdr=t=>`<div class=bar><button onclick="go('${['table','tv','host','stats'].includes(view)?'tmenu':'home'}')">←</button><b>${esc(t)}</b></div>`;
const tRounds=()=>cfg?rounds.filter(r=>r.tid===cfg.tid):[];
const hands=i=>tRounds().filter(r=>r.table===i&&r.rd===cfg.round);
function totals(rs){const t={};rs.forEach(r=>{for(const p in r.d)t[p]=(t[p]||0)+r.d[p]});return t}
const pad=n=>String(n).padStart(2,'0');
const msLeft=()=>Math.max(0,cfg.start+cfg.limit.v*60000-Date.now());
function tick(){if(!cfg||!cfg.limit)return;
 document.querySelectorAll('.tm').forEach(e=>{if(cfg.limit.k!=='t')return;const ms=msLeft(),big=e.parentNode&&e.parentNode.className==='bigtm';e.textContent=ms?Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60):(big?'0:00':'laiks beidzies');e.style.color=ms<60000?'var(--neg)':''});
 if(cfg.limit.k==='t'){const e=msLeft()===0;if(wasEnd!==null&&e!==wasEnd){wasEnd=e;if(['table','tv','host'].includes(view))render()}else wasEnd=e}}
const prog=i=>cfg.limit.k==='h'?`${hands(i).length}/${cfg.limit.v} partijas`:`<span class=tm></span> · ${hands(i).length} partijas`;
const done=i=>cfg.limit.k==='h'&&hands(i).length>=cfg.limit.v;

// ---- sēdināšana ----
function layout(n){const t=Math.floor(n/3),r=n%3;if(t<1||r>t)return null;return Array.from({length:t},(_,i)=>i<r?4:3)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seat(o){const lay=layout(o.length);let i=0;return lay.map((s,k)=>({n:'Galds '+(k+1),players:o.slice(i,i+=s)}))}
function lpv(){const pl=[...new Set($('#tp').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))],l=layout(pl.length);
 $('#lp').innerHTML=!pl.length?'':l?`${pl.length} spēlētāji → ${l.length} galdi (${l.map(x=>x).join('+')})`:`<span class=n>${pl.length} spēlētāji: nevar sadalīt pa 3–4 (vajag 3, 4 vai 6 un vairāk)</span>`}

// ---- sākums ----
function homeV(){return `<div class=hero><div class=suits>♠ ♥ ♣ ♦</div><h1>Zole</h1><p>Pieraksti zoles punktus digitāli</p></div>
<button class="big pri" onclick="go('solo')"><b class=ic>✎</b>Pierakstīt <br><small style="color:inherit">tikai šajā ierīcē, vairāki galdi</small></button>
${SRV?`<div class=lbl>Turnīrs</div><button class=big onclick="go('tcreate')">Izveidot turnīru <br><small>Spēlētāji, galdi un kārtas</small></button>${tlist()}`:'<div class="card mu" style="margin-top:18px"><small>Turnīra režīms ir pieejams, kad lapa ir palaista uz sava servera (Render vai dators).</small></div>'}
<div class=ver onclick="adminOpen()" style="cursor:pointer;padding:8px">Versija ${VERSION}</div>`}

// ---- admin ----
function adminOpen(){if(!SRV)return;adm={};go('admin')}
function adminV(){return hdr('Admin')+(adm.list?`<small class=mu>Aktīvie turnīri (${adm.list.length}). „Ieiet” atver turnīru ar pilnām rīkotāja tiesībām.</small>`+(adm.list.length?adm.list.map(t=>`<div class=card><b>${esc(t.name)}</b><br><small class=mu>${t.players} spēlētāji · ${t.round}. kārta · ${t.hands} partijas</small><br><button class=pri style="margin-top:8px" onclick="adminEnter('${t.tid}')">Ieiet kā rīkotājs</button></div>`).join(''):'<div class="card mu">Nav aktīvu turnīru.</div>')+`<button onclick="adminLogin(1)">Atjaunot sarakstu</button>`:`<div class=card><div class=lbl>Admin parole</div><input id=ap type=password placeholder="Parole" autocomplete="off"><button class=pri onclick="adminLogin()" style="width:100%;margin-top:8px">Ieiet</button></div>`)}
function adminLogin(again){const pw=again?adm.pw:$('#ap').value;fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(r=>r.status===200?r.json():Promise.reject(new Error(r.status===403?'Nepareiza admin parole':r.status===404?'Admin režīms nav ieslēgts serverī (nav iestatīta ADMIN_PASSWORD)':r.status===429?'Pārāk daudz mēģinājumu, pamēģini vēlāk':'servera kļūda '+r.status))).then(d=>{adm={pw,list:d.list};render()}).catch(e=>alert(e.message))}
function adminEnter(tid){fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adm.pw,tid})}).then(r=>r.ok?r.json():Promise.reject(new Error('Neizdevās ieiet'))).then(d=>{myT[tid]={token:d.token,host:d.host,name:d.name};ls.set('myT',myT);enterT(tid)}).catch(e=>alert(e.message))}

// ---- izveidot turnīru ----
function createV(){return hdr('Izveidot turnīru')+`<div class=card>
<div class=lbl>Nosaukums</div><input id=tn placeholder="Zoles turnīrs">
<div class=lbl>Parole (to ievadīs spēlētāji, lai pievienotos)</div><input id=tw placeholder="Vismaz 3 simboli" autocomplete="off">
<div class=lbl>Rīkotāja parole (lai vēlāk pieslēgtos kā rīkotājs no citas ierīces)</div><input id=th placeholder="Vismaz 3 simboli, atšķirīga no pirmās" autocomplete="off">
<div class=lbl>Spēlētāji (katrs savā rindā vai ar komatu)</div><textarea id=tp rows=7 oninput="lpv()" placeholder="Anna&#10;Jānis&#10;Māra&#10;..."></textarea><div id=lp class=mu></div>
<div class=lbl>Kārta beidzas</div><div class=bar><select id=lk style="flex:1"><option value=h>pēc partiju skaita galdā</option><option value=t>pēc laika (minūtes)</option></select><input id=lv type=number min=1 value=24 style="width:90px"></div><div class=lbl>Kārtu skaits</div><input id=tr type=number min=1 value=7></div>
${rin(DEF)}
<button class=pri onclick="createT()" style="width:100%">Izveidot turnīru (1. kārta, nejauša sēdināšana)</button>`}
function createT(){const pl=[...new Set($('#tp').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))];
 if(!layout(pl.length))return alert('Vajag 3, 4 vai vismaz 6 spēlētājus (pa 3, pārpalikums pa 4).');
 const pw=$('#tw').value.trim(),hp=$('#th').value.trim();if(pw.length<3||hp.length<3)return alert('Ievadi abas paroles (vismaz 3 simboli katra).');if(pw===hp)return alert('Rīkotāja parolei jābūt citādai nekā spēlētāju parolei.');
 const rules=readRules();if(!rules)return;
 const c={name:$('#tn').value.trim()||'Zoles turnīrs',players:pl,limit:{k:$('#lk').value,v:Math.max(1,parseInt($('#lv').value)||1)},rules,round:1,total:Math.max(1,parseInt($('#tr').value)||7),start:Date.now(),tables:seat(shuffle(pl))};
 fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cfg:c,password:pw,hostPassword:hp})}).then(r=>r.ok?r.json():Promise.reject(new Error('servera kļūda '+r.status))).then(d=>{myT[d.tid]={token:d.token,host:d.host,name:c.name};ls.set('myT',myT);enterT(d.tid)}).catch(e=>alert('Neizdevās: '+e.message))}

// ---- pievienoties ----
function tlist(){return list.length?`<div class=lbl>Aktīvie turnīri</div>`+list.map(t=>myT[t.tid]?`<button class=big onclick="enterT('${t.tid}')"><b>${esc(t.name)}</b> <small>✓ pievienots</small></button>`:jsel===t.tid?`<div class=card><b>${esc(t.name)}</b><input id=jp type=password placeholder="Parole (spēlētāja vai rīkotāja)" autocomplete="off"><button class=pri onclick="doJoin('${t.tid}')">Pievienoties</button><button onclick="jsel=null;render()">Atcelt</button></div>`:`<button class=big onclick="jsel='${t.tid}';render()"><b>${esc(t.name)}</b><br><small>Spied, lai ievadītu paroli</small></button>`).join(''):''}
function doJoin(tid){const pw=$('#jp').value;
 fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tid,password:pw})}).then(r=>r.ok?r.json():Promise.reject(new Error(r.status===403?'Nepareiza parole':r.status===429?'Pārāk daudz mēģinājumu, pamēģini vēlāk':'servera kļūda '+r.status))).then(d=>{const t=list.find(x=>x.tid===tid);myT[tid]={token:d.token,host:d.host,name:t?t.name:''};ls.set('myT',myT);enterT(tid)}).catch(e=>alert(e.message))}

// ---- turnīra izvēlne ----
function menuV(){const m=myT[cur]||{};return hdr(cfg?cfg.name:(m.name||'Turnīrs'))+`<button class="big pri" onclick="go('table')">Galda ierīces sadaļa<br><small style="color:inherit">Ievadi punktus pie sava galda</small></button>
<button class=big onclick="go('tv')">Pilnā tabula<br><small>Visu spēlētāju rezultāti</small></button>
<button class=big onclick="go('stats')">Statistika<br><small>Cik reižu izspēlēta zole, mazā zole u.c.</small></button>
${m.host?`<button class=big onclick="go('host')">Rīkotāja panelis<br><small>Nākamā kārta, Excel, beigt turnīru</small></button>`:''}
${m.host?'':`<button onclick="upHost()">Pieslēgties kā rīkotājs</button>`}<button class=danger onclick="leaveT()">Pamest turnīru šajā ierīcē</button>`}

function calcStats(){const S={},mk=p=>S[p]||(S[p]={p,n:0,pts:0,L:[0,0],Z:[0,0],M:[0,0],G:0});cfg.players.forEach(mk);
 tRounds().forEach(r=>{if(!r.d)return;for(const p in r.d){const x=mk(p);x.n++;x.pts+=r.d[p]}
  if(r.g==='Custom'||r.g==='Pule')return;
  let m=r.m;if(!m){const e=Object.entries(r.d),po=e.filter(y=>y[1]>0),ne=e.filter(y=>y[1]<0);m=po.length===1?po[0][0]:ne.length===1?ne[0][0]:null}
  if(!m||!S[m])return;const k={'Lielais':'L','Zole':'Z','Mazā zole':'M'}[r.g];
  if(k){S[m][k][1]++;if(r.d[m]>0)S[m][k][0]++}else if(r.g==='Galdiņš')S[m].G++});

function tablesOf(r){return r===cfg.round?cfg.tables:((cfg.hist||[]).find(h=>h.round===r)||{tables:[]}).tables}
function lpFor(sc){const n=sc.length,pts=n>=4?[6,4,2,0]:[6,4,2],sr=sc.slice().sort((a,b)=>b.s-a.s),res={};let i=0;
 while(i<n){let j=i;while(j<n&&Math.abs(sr[j].s-sr[i].s)<1e-6)j++;const avg=pts.slice(i,j).reduce((a,x)=>a+x,0)/(j-i);for(let k=i;k<j;k++)res[sr[k].p]=avg;i=j}return res}
function stand(){const all=tRounds(),lp={},sm={},per={},psm={};cfg.players.forEach(p=>{lp[p]=0;sm[p]=0});
 for(let r=1;r<=cfg.round;r++){per[r]={};psm[r]={};const rr=all.filter(x=>x.rd===r);
  tablesOf(r).forEach((tb,i)=>{const hs=rr.filter(x=>x.table===i),sc=tb.players.map(p=>({p,s:hs.reduce((a,x)=>a+((x.d&&x.d[p])||0),0)}));
   sc.forEach(x=>{psm[r][x.p]=x.s;sm[x.p]=(sm[x.p]||0)+x.s});
   if(hs.length){const l=lpFor(sc);for(const p in l){per[r][p]=l[p];lp[p]=(lp[p]||0)+l[p]}}})}
 return {lp,sm,per,psm}}
function arrows(L,St){const res={},R=cfg.round,cr=tRounds().filter(r=>r.rd===R),cl=x=>Math.round(x*100)/100;
 cfg.tables.forEach((tb,i)=>{const h=cr.filter(r=>r.table===i).sort((a,b)=>a.t-b.t),last=h[h.length-1];if(!last)return;
  const sc=tb.players.map(p=>({p,s:(St.psm[R][p]||0)-(last.d[p]||0)})),nl=h.length>1?lpFor(sc):{},pl={...St.lp},ps={...St.sm};
  tb.players.forEach(p=>{pl[p]=St.lp[p]-(St.per[R][p]||0)+(nl[p]||0);ps[p]=St.sm[p]-(last.d[p]||0)});
  const rk=(P,S,p)=>1+L.filter(x=>cl(P[x.p])>cl(P[p])||(cl(P[x.p])===cl(P[p])&&cl(S[x.p])>cl(S[p]))).length;
  tb.players.forEach(p=>{const a=rk(pl,ps,p),b=rk(St.lp,St.sm,p);res[p]=a>b?1:a<b?-1:0})});
 return res}

function hist(rs,u){return `<div class=card><h3>Partijas (${rs.length})</h3>${rs.slice().reverse().map((r,i)=>`<div class="h ${i===0?'last':''}">#${rs.length-i} · ${esc(r.g==='Custom'?'Cits':r.g==='Pule'?'Visi nopasē (pule)':r.g)}${r.o!==r.g?' · '+esc(r.o):''}<div>${Object.entries(r.d).map(([p,v])=>`<span class=pp><span>${esc(p)}</span><b class="${v<0?'n':''}">${fmt(v)}</b></span>`).join('')}</div></div>`).join('')||'<span class=mu>Vēl nav partiju.</span>'}${rs.length?`<button onclick="${u}">Atcelt pēdējo partiju</button>`:''}</div>`}

// ---- noteikumu redaktors ----
const rin=(r,open)=>{const B0=PRE.MG.games,m=r.mode||'MG',miss=Object.keys(B0).filter(n=>!r.games[n]),base=(n,l)=>{const b=B0[n]&&B0[n].find(o=>o[0]===l);return b?b[1]:''};
 return `<div id=rw><details id=rd data-m="${m}" ${open?'open':''} class=card><summary><b>Punktu noteikumi</b> <small>· ${m}</small></summary>
<div class=lbl>Variants</div>${['MG','G','P'].map(x=>`<button class="${m===x?'on':''}" onclick="rmode('${x}')">${x==='P'?'P (pulēm)':x}</button>`).join('')}
<br><small class=mu>Zeltaini iekrāsots = atšķiras no MG.</small>
${m==='P'?'<div class="lbl chg">Pule: pievienota spēle „Visi nopasē (pule)”, lielais uzvarot paņem puli</div>':''}
${miss.length?`<div class="lbl chg">Nav šajā variantā: ${miss.map(esc).join(', ')}</div>`:''}
<br><small>Punkti norādīti 3 spēlētāju galdam. Pie 4 spēlētājiem lielais saņem vai maksā 1,5×, katrs pārējais (arī dalītājs) tikpat kā pie 3.</small>
${Object.keys(r.games).map(n=>`<div class="lbl ${B0[n]?'':'chg'}">${esc(n)}${B0[n]?'':' (jauna spēle)'}</div>${r.games[n].map(o=>{const b=base(n,o[0]);return `<div class=bar><span style="flex:1">${esc(o[0])}</span><input class="rp ${b===''||+b!==+o[1]?'chg':''}" style="width:90px" type=number step=any inputmode=decimal data-g="${esc(n)}" data-l="${esc(o[0])}" data-b="${b}" value="${o[1]}" oninput="this.classList.toggle('chg',this.dataset.b===''||+this.value!==+this.dataset.b)"></div>`}).join('')}`).join('')}
<div class=lbl>Pievienot spēli (viena rindā, piem.  Super: Uzvara=10, Zaudējums=-8)</div><textarea id=rx rows=2></textarea>
<small>Vienreizējiem punktiem partijā izvēlies „Cits”.</small></details></div>`};
function rmode(m){const r=JSON.parse(JSON.stringify(PRE[m]));r.mode=m;$('#rw').outerHTML=rin(r,true)}
function readRules(){const g={};document.querySelectorAll('.rp').forEach(e=>{const n=e.dataset.g;(g[n]=g[n]||[]).push([e.dataset.l,parseFloat(e.value)||0])});
 for(const line of ($('#rx').value||'').split('\n').map(x=>x.trim()).filter(Boolean)){const m=line.match(/^([^:]+):(.+)$/);const o=m&&m[2].split(',').map(x=>x.split('=')).map(a=>[(a[0]||'').trim(),parseFloat(a[1])]);
  if(!m||o.some(x=>!x[0]||isNaN(x[1]))){alert('Pievienotās spēles formāts:  Nosaukums: Uzvara=10, Zaudējums=-8');return null}g[m[1].trim()]=o}
 return {mode:$('#rd').dataset.m,opp:0.5,games:g}}

// ---- Excel (.xlsx) eksports (bez bibliotēkām) ----
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zip(files){const E=new TextEncoder(),out=[],cd=[],u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];let off=0;
 files.forEach(([n,s])=>{const nb=E.encode(n),d=E.encode(s),c=crc(d),h=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
  out.push(h,nb,d);cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);off+=h.length+nb.length+d.length});
 const cs=cd.reduce((a,x)=>a+x.length,0),end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
 return new Blob([...out,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const cn=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const XH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
function sheetXml(rows){return XH+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,y)=>`<row r="${y+1}">`+r.map((v,x)=>v===''||v==null?'':typeof v==='number'?`<c r="${cn(x)}${y+1}"><v>${v}</v></c>`:`<c r="${cn(x)}${y+1}" t="inlineStr"><is><t>${xe(v)}</t></is></c>`).join('')+'</row>').join('')+'</sheetData></worksheet>'}
function xlsx(sheets,name){const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',f=[
 ['[Content_Types].xml',XH+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'],
 ['_rels/.rels',XH+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
 ['xl/workbook.xml',XH+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>`+sheets.map((s,i)=>`<sheet name="${xe(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'],
 ['xl/_rels/workbook.xml.rels',XH+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>'],
 ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s[1])])];
 const a=document.createElement('a');a.href=URL.createObjectURL(zip(f));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const rn=n=>Math.round(n*10)/10,lt=t=>new Date(t).toLocaleString('lv-LV');
function exportT(){if(!cfg)return;const all=tRounds(),St=stand(),rds=Array.from({length:cfg.round},(_,i)=>i+1);
 const names=cfg.players.slice().sort((a,b)=>St.lp[b]-St.lp[a]||St.sm[b]-St.sm[a]),same=(a,b)=>Math.abs(St.lp[a]-St.lp[b])<1e-6&&Math.abs(St.sm[a]-St.sm[b])<1e-6;
 const res=[['Vieta','Spēlētājs','Lielie punkti','Mazie punkti',...rds.flatMap(r=>[r+'. kārta LP',r+'. kārta mazie'])],...names.map(p=>[names.findIndex(q=>same(p,q))+1,p,rn(St.lp[p]),rn(St.sm[p]),...rds.flatMap(r=>[rn(St.per[r][p]||0),rn(St.psm[r][p]||0)])])];
 const tb=r=>r===cfg.round?cfg.tables:((cfg.hist||[]).find(h=>h.round===r)||{tables:[]}).tables;
 const par=[['Kārta','Galds','Partijas nr.','Laiks','Spēle','Rezultāts','Dalītājs','Spēlētājs','Punkti']],cnt={};
 all.slice().sort((a,b)=>a.t-b.t).forEach(r=>{const k=r.rd+'|'+r.table;cnt[k]=(cnt[k]||0)+1;const tn=(tb(r.rd)[r.table]||{}).n||'Galds '+(r.table+1);
  for(const p in r.d)par.push([r.rd,tn,cnt[k],lt(r.t),gl(r.g),r.o===r.g?'':r.o,r.dl||'',p,rn(r.d[p])])});
 const gal=[['Kārta','Galds','Spēlētāji']];rds.forEach(r=>tb(r).forEach(x=>gal.push([r,x.n,x.players.join(', ')])));
 xlsx([['Rezultāti',res],['Partijas',par],['Galdi',gal],['Statistika',statRows()]],((cfg.name||'zole').replace(/[^\w\-āčēģīķļņšūžĀČĒĢĪĶĻŅŠŪŽ ]/g,'')||'zole')+'.xlsx')}
function exportS(){const s=solo,t=totals(s.rounds);if(!s.players.length)return;
 const res=[['Spēlētājs','Kopā'],...s.players.map(p=>[p,rn(t[p]||0)])];
 const par=[['Nr.','Laiks','Spēle','Rezultāts','Dalītājs',...s.players],...s.rounds.map((r,i)=>[i+1,lt(r.t),gl(r.g),r.o===r.g?'':r.o,r.dl||'',...s.players.map(p=>p in r.d?rn(r.d[p]):'')])];
 xlsx([['Rezultāti',res],['Partijas',par]],'zole-'+new Date().toISOString().slice(0,10)+'.xlsx')}

// ---- sēdvietu secība (velkams saraksts) ----
let DG=null;
function orderEd(pl,fn){return `<details class=card><summary><b>Sēdvietu secība</b> <small>· velc ☰, lai samainītu</small></summary><div id=ol data-fn="${fn}">${pl.map((p,i)=>`<div class=ord data-i="${i}"><span class=hd onpointerdown="dgS(event,this)" onpointermove="dgM(event)" onpointerup="dgE()" onpointercancel="dgE()">☰</span> ${esc(p)}</div>`).join('')}</div><small>Dalītājs mainās šajā secībā.</small></details>`}
function dgS(e,h){DG=h.parentNode;DG.style.opacity=.6;h.setPointerCapture(e.pointerId)}
function dgM(e){if(!DG)return;const el=document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest&&el.closest('[data-i]');if(!r||r===DG||r.parentNode!==DG.parentNode)return;const b=r.getBoundingClientRect(),hz=r.parentNode.classList.contains('sb'),bf=hz?e.clientX<b.left+b.width/2:e.clientY<b.top+b.height/2;r.parentNode.insertBefore(DG,bf?r:r.nextSibling)}
function dgE(){if(!DG)return;DG.style.opacity=1;DG=null;const l=$('#ol');window[l.dataset.fn]([...l.children].map(x=>+x.dataset.i))}
function ordS(ix){solo.players=ix.map(i=>solo.players[i]);svSolo();render()}
function ordT(ix){const pl=ix.map(i=>cfg.tables[tbl].players[i]);api('/api/t/'+cur+'/order','POST',{table:tbl,players:pl}).catch(e=>alert('Neizdevās: '+e.message))}

// ---- partijas ievade ----
let saver=null;
function autoDl(pl,rs){for(let k=rs.length-1;k>=0;k--){if(rs[k].dl){const i=pl.indexOf(rs[k].dl);if(i>=0)return (i+1)%pl.length}}return 0}
function initH(pl,rs){if(!H||H.pl.join('|')!==pl.join('|'))H={pl,dealer:autoDl(pl,rs||[]),chg:false,main:null,g:null,o:null,c:{}};H.rs=rs||[]}
let ordEd=false;
function togOrd(){ordEd=!ordEd;render()}
const ordBtn=()=>`<div style="text-align:right"><button class="${ordEd?'on':''}" style="min-height:0;padding:7px 12px;font-size:14px" onclick="togOrd()">${ordEd?'Gatavs':'Mainīt secību'}</button></div>`;
function setDl(i){if(!H)return;H.dealer=i;if(H.pl.length>3&&H.main===H.pl[i])H.main=null;render()}
function hand(pl,sv,rs){saver=sv;initH(pl,rs);
 const P=pl.length>3?pl.filter((_,i)=>i!==H.dealer):pl,d=deltas();
 const B=(on,k,v,l)=>`<button class="${on?'on':''}" onclick="hs('${k}',${v})">${esc(l)}</button>`;
 return `<div class=card><h3>Jauna partija</h3>${R().mode==='P'?`<div class=lbl>Pules uz galda: <b>${pool(H.rs)}</b></div>`:''}
${pl.length>3?`<div class=lbl>Dalītājs (nespēlē) <button onclick="H.chg=!H.chg;render()" style="min-height:0;padding:4px 10px">mainīt</button></div>${H.chg?pl.map((p,i)=>B(H.dealer===i,'dealer',i,p)).join(''):`<b>${esc(pl[H.dealer])}</b>`}`:''}
${!['Custom','Pule'].includes(H.g)?`<div class=lbl>${H.g==='Galdiņš'?'Kas zaudēja':'Kas spēlēja (lielais)'}</div>${P.map(p=>B(H.main===p,'main',pl.indexOf(p),p)).join('')}`:''}
<div class=lbl>Spēle</div>${Object.keys(GM()).map((g,i)=>B(H.g===g,'g',i,gl(g))).join('')}
${H.g&&!['Custom','Pule'].includes(H.g)?`<div class=lbl>Rezultāts (spēlētājs / katrs pārējais)</div>${GM()[H.g].map((o,i)=>B(H.o===i,'o',i,o[0]+' ('+fmt(o[1]*R().opp*(pl.length-1))+' / '+fmt(-o[1]*R().opp)+')')).join('')}`:''}
${H.g==='Custom'?`<div class=lbl>Punkti katram spēlētājam</div>${pl.map(p=>`<div class=bar><span style="flex:1">${esc(p)}</span><input style="width:110px" type=number step=any inputmode=decimal value="${H.c[p]??''}" oninput="H.c[${JSON.stringify(p).replace(/"/g,'&quot;')}]=this.value;upd()"></div>`).join('')}`:''}
<div id=pv>${pvH(d)}</div>
<button class=pri ${d?'':'disabled'} id=sv onclick="hsave()" style="width:100%;margin-top:8px">Saglabāt partiju</button></div>`}
function pvH(d){return d?Object.entries(d).map(([p,v])=>`${esc(p)} <b class="${v<0?'n':''}">${fmt(v)}</b>`).join(' · '):'<span class=mu>Aizpildi laukus augstāk</span>'}
function upd(){const d=deltas();$('#pv').innerHTML=pvH(d);$('#sv').disabled=!d}
function hs(k,v){if(!H){render();return}if(k==='dealer'){H.dealer=v;if(H.main===H.pl[v])H.main=null}else if(k==='main')H.main=H.pl[v];else if(k==='g'){H.g=Object.keys(GM())[v];H.o=null}else H.o=v;render()}
function deltas(){const pl=H.pl,n=pl.length,d={};H.plc=0;if(n>3&&H.dealer<0)return null;
 if(H.g==='Custom'){if(pl.every(p=>H.c[p]===undefined||H.c[p]===''))return null;pl.forEach(p=>d[p]=+H.c[p]||0);return d}
 if(H.g==='Pule'){pl.forEach(p=>d[p]=-1);H.plc=1;return d}
 if(!H.g||H.main==null||H.o==null)return null;const v=GM()[H.g][H.o][1],o=R().opp;
 pl.forEach(p=>d[p]=p===H.main?v*o*(n-1):-v*o);
 if(R().mode==='P'&&H.g==='Lielais'&&pool(H.rs)>0){d[H.main]+=v>0?n:-n;H.plc=v>0?-1:1}
 return d}
function hsave(){if(!H)return render();const d=deltas();if(!d)return;window[saver]({t:Date.now(),dl:H.pl[H.dealer],m:H.main||undefined,g:H.g,o:(H.g==='Custom'||H.g==='Pule')?H.g:GM()[H.g][H.o][0],d,pl:H.plc||undefined})}
loadList();render();
</script></body></html>
