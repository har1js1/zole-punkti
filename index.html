<meta name="theme-color" content="#0a191e"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a191e;--fg:#eaf1ee;--card:#12292f;--ac:#4a9878;--on:#0a191e;--gd:#d8b65c;--mu:#8ea8a6;--bd:#21424a;--neg:#ff8a7e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
h1{margin:6px 0 2px}h3{margin:0 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:4px 4px 4px 0;min-height:46px;cursor:pointer}
button:disabled{opacity:.45}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.big{display:block;width:100%;text-align:left;margin:8px 0;padding:16px}
input,textarea,select{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:11px;margin:4px 0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px}.bar b{flex:1;font-size:18px}
.sb{display:flex;gap:8px}.sb>div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.sb b{display:block;font-size:19px;overflow:hidden;text-overflow:ellipsis}.sb span{font-size:30px;font-weight:700}
.n{color:var(--neg)}.h{padding:8px 0;border-bottom:1px solid var(--bd)}
.lbl{margin:10px 0 2px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;background:var(--ac);color:var(--on);border-radius:99px;padding:4px 12px;font-weight:600;margin:4px 6px 4px 0}
.tv{padding:22px}.tv h1{font-size:clamp(28px,4vw,52px)}
.cols{column-width:420px;column-gap:20px}
.row{break-inside:avoid;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:0 0 10px;font-size:clamp(20px,2.4vw,34px)}
.row .r{width:2.2em;font-weight:800;color:var(--ac)}.row .p{flex:1}.row small{font-size:.5em}.row .s{font-weight:800}
.g1 .r{font-size:1.3em}
.sb .hd{display:block;font-size:18px;font-weight:400;line-height:1;padding:4px 0 6px;touch-action:none;cursor:grab;user-select:none;color:var(--mu)}
.up{color:#2fb36b;font-size:.6em}.dn{color:var(--neg);font-size:.6em}
.tv{padding:12px}.tv .row{margin:0;font-size:inherit;padding:0 14px}.tv .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:var(--bg)}
.hd{font-size:22px;touch-action:none;cursor:grab;padding:0 8px;user-select:none}
h1{color:var(--gd)}summary{color:var(--gd);cursor:pointer}
.row .r{color:var(--gd)}.row .s{color:var(--gd)}.row .s.n{color:var(--neg)}
.chip{background:var(--gd);color:#0a191e}
.sb span{color:var(--gd)}.sb span.n{color:var(--neg)}
.up{color:var(--ac)}
button.pri{color:#0a191e}
.pp{display:inline-flex;flex-direction:column;align-items:center;min-width:68px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:4px 12px;margin:6px 6px 0 0}.pp span{font-size:14px;color:var(--fg)}.pp b{font-size:22px;color:var(--ac)}.pp b.n{color:var(--neg)}
.row.out{opacity:.55}
.sb>div{cursor:pointer}.sb>div.dl{border-color:var(--gd);box-shadow:0 0 0 2px var(--gd),0 0 18px 4px rgba(216,182,92,.55)}
.danger{background:#b3392f;border-color:#b3392f;color:#fff;font-weight:600}
.bigtm{font-size:52px;font-weight:800;color:var(--gd);line-height:1.15}
.g2{display:flex;justify-content:space-between;gap:10px;line-height:1.5}
.row .sm{font-size:.55em;color:var(--mu);width:3.6em;text-align:right}.row .sm.n{color:var(--neg)}
.lbl.chg{color:var(--gd);font-weight:700}.chg:not(.lbl){border-color:var(--gd)!important;background:rgba(216,182,92,.18)}
.ar{display:inline-block;width:1.2em;text-align:center}.ar .up,.ar .dn{font-size:1em;font-weight:700}
.w.wide{max-width:none;padding:0}
.h.last{background:rgba(216,182,92,.13);border-left:3px solid var(--gd);padding-left:9px;border-radius:6px}
/* ---- vizuālais uzlabojums ---- */
body{background:radial-gradient(900px 520px at 50% -8%,#17423f 0%,rgba(10,25,30,0) 70%) fixed,#0a191e;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h3,.bar b,.hero h1{font-family:'Isometra','Inter',system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
.hero{text-align:center;padding:30px 0 14px}.hero h1{font-size:60px;margin:0;line-height:1.05;text-shadow:0 2px 22px rgba(216,182,92,.28)}.hero p{margin:6px 0 0;color:var(--mu)}
.suits{font-size:22px;letter-spacing:.55em;color:var(--ac);padding-left:.55em}
.card{background:linear-gradient(180deg,#143139,#102a31);border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
button{border-radius:14px;background:#133038;transition:transform .08s,border-color .15s}button:active{transform:scale(.97)}
button.on,button.pri{background:linear-gradient(180deg,#5bb690,#3f8a6b);border-color:#5bb690;color:#06140f;font-weight:700;box-shadow:none}
button.big{border-radius:18px;padding:18px 20px;background:linear-gradient(180deg,#143139,#102a31);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:18px}
button.big.pri{background:linear-gradient(180deg,#5bb690,#3f8a6b)}
button.big small{font-size:13px;font-weight:400;opacity:.85}.big .ic{display:inline-block;width:1.7em;font-size:1.15em;text-align:center;color:var(--gd)}.big.pri .ic{color:#06140f}
button.big small.pln{display:block;margin-top:4px;font-size:19px;line-height:1.3;color:var(--fg);opacity:1;font-weight:500}
html,body{overflow-anchor:none}
@media(min-width:720px){
.home-split{display:flex;gap:16px;align-items:flex-start}
.home-hist{flex:1;min-width:0}
.home-main{flex:2;min-width:0}
.home-hist .big{height:100%}
}

button.danger{background:linear-gradient(180deg,#cb4a3d,#a53329);border-color:#cb4a3d;color:#fff}
input,textarea,select{border-radius:12px;background:#0b1f25}input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.bar b{font-size:20px;color:var(--gd)}.bar>button:first-child{width:44px;padding:0;border-radius:50%;flex:none}
.sb>div{border-radius:18px;background:linear-gradient(180deg,#163740,#112b32);box-shadow:0 6px 16px rgba(0,0,0,.3);padding:12px 8px}
.sb span{font-size:36px;font-variant-numeric:tabular-nums}.sb .hd{font-size:18px}
.row{background:linear-gradient(90deg,#143139,#102a31);border-radius:16px}
.row.r1{box-shadow:inset 6px 0 0 #d8b65c}.row.r2{box-shadow:inset 6px 0 0 #b9c4c6}.row.r3{box-shadow:inset 6px 0 0 #c8855a}
.pp{border-radius:12px;background:#0b1f25}.chip{border-radius:99px}
.tm,.bigtm{font-variant-numeric:tabular-nums}
.chip .tm{display:inline-block;min-width:5ch;text-align:center}
.bigtm{min-width:5ch;text-align:center}
.chip svg.pie{flex:none}
.ver{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mu)}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const VERSION='4.6';
const fmt=n=>(n>0?'+':'')+(Math.round(n*10)/10);
// Punkti: [nosaukums, punkti spēlētājam]; pretinieki saņem pretējo zīmi (pusi vai visu).
const BASE={"Lielais":[["Uzvara 61–90",2],["Uzvara 91+ (jaņi)",4],["Uzvara visi stiķi",6],["Zaudējums 31–60",-4],["Zaudējums ≤30",-6],["Zaudējums, nav stiķu",-8]],
"Zole":[["Uzvara 61–90",10],["Uzvara 91+ (jaņi)",12],["Uzvara visi stiķi",14],["Zaudējums 31–60",-12],["Zaudējums ≤30",-14],["Zaudējums, nav stiķu",-16]],
"Mazā zole":[["Uzvara",12],["Zaudējums",-14]],
"Galdiņš":[["Zaudētājs",-4]]};
const mk=(m,...k)=>({mode:m,opp:0.5,games:Object.fromEntries(k.map(x=>[x,BASE[x]]))});
const PRE={MG:mk('MG','Lielais','Zole','Mazā zole','Galdiņš'),G:mk('G','Lielais','Zole','Galdiņš'),P:mk('P','Lielais','Zole','Mazā zole')};
const DEF=PRE.MG;
const R=()=>(view==='solo'?solo.rules:cfg&&cfg.rules)||DEF;
const GM=()=>Object.assign({},R().games,R().mode==='P'?{"Pule":[]}:{},{"Custom":[]});
const gl=g=>g==='Custom'?'Cits (ievadi pats)':g==='Pule'?'Visi nopasē (pule)':g;
const pool=rs=>rs.reduce((a,r)=>a+(r.pl||0),0);
const LV=new Intl.DateTimeFormat();
let SRV=true,adm={},ending=false,cfg=null,rounds=[],view='home',H=null,tbl=null,cur=null,list=[],jsel=null,es=null,solos=ls.get('solos',null)||[ls.get('solo',{players:[],rounds:[]}),ls.get('solo2',{players:[],rounds:[]})],sc=ls.get('sc',0),solo=solos[sc]||(sc=0,solos[0]),myT=ls.get('myT',{});
setInterval(tick,1000);setInterval(()=>{if(view==='home')loadList()},4000);
let pinTopUntil=0;
const hr=()=>{const a=document.activeElement;if(a&&a.classList&&(a.classList.contains('ep')||a.classList.contains('ti'))&&['host','tv'].includes(view))return;render();if(Date.now()<pinTopUntil)jumpTop()};
const api=(p,m,b,host)=>{const t=myT[cur]||{};return fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Token':t.token||'','X-Host':host&&t.host?t.host:''},body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error(r.status===403?'nav atļaujas':'servera kļūda '+r.status);return r.json().catch(()=>({}))})};
function openT(){closeT();const m=myT[cur];if(!m)return;cfg=null;rounds=[];
es=new EventSource('/events?t='+cur+'&k='+m.token);
es.onmessage=e=>{const d=JSON.parse(e.data);if(d.gone||d.type==='gone'){delete myT[cur];ls.set('myT',myT);if(!ending)alert('Turnīrs ir beidzies.');ending=false;go('home');return}if(d.type==='add'){if(!rounds.some(r=>r.id===d.round.id))rounds.push(d.round)}else if(d.type==='del'){rounds=rounds.filter(r=>r.id!==d.id)}else if(d.type==='upd'){rounds=rounds.map(r=>r.id===d.round.id?d.round:r)}else if(d.type==='cfg'){const _pr=cfg&&cfg.round;cfg=d.cfg&&d.cfg.limit?d.cfg:null;if(cfg&&_pr!=null&&cfg.round!==_pr){tbl=null;try{ls.set('tbl_'+cur,null)}catch(e){}}}else{cfg=d.cfg&&d.cfg.limit?d.cfg:null;rounds=d.rounds||[]}hr()}}
function closeT(){if(es){es.close();es=null}}
function loadList(){fetch('/api/list').then(r=>{if(!r.ok||!/json/.test(r.headers.get('content-type')||''))throw 0;return r.json()}).then(l=>{SRV=true;list=l;if(view==='home'&&!jsel)render()}).catch(()=>{if(SRV){SRV=false;if(view==='home')render()}})}
function enterT(t){cur=t;tbl=ls.get('tbl_'+t,null);openT();go('tmenu')}
function go(v){if(!['tmenu','table','tv','host','stats','hist','histv','histmenu','histtv','histstats'].includes(v)){closeT();cur=null;cfg=null;rounds=[]}if(v!=='admin')adm={};view=v;H=null;pendDl=null;tmOpenF=false;tmv=null;ordEd=false;dlPick=false;if(v==='table'&&cfg&&tbl!=null&&typeof done==='function'&&done(tbl)){tbl=null;ls.set('tbl_'+cur,null)}if(v==='home'){jsel=null;loadList()}if(v==='hist'){archList=null;loadArch();if(!cur){cfg=null;rounds=[]}}render();scrollTo(0,0)}
function render(){const f={home:homeV,solo:soloV,tv:tvV,table:tableV,host:hostV,tcreate:createV,tmenu:menuV,stats:statsV,admin:adminV,hist:histListV,histv:histViewV,histmenu:histMenuV,histtv:tvV,histstats:statsV}[view];$('#app').className=(view==='tv'||view==='histtv')?'w wide':'w';$('#app').innerHTML=f();tick()}
const hdr=t=>{const back=['table','tv','host','stats'].includes(view)?'tmenu':['histtv','histstats'].includes(view)?'histmenu':(view==='histmenu'||view==='histv')?'hist':(view==='hist'?'home':'home');return `<div class=bar><button onclick="go('${back}')">←</button><b>${esc(t)}</b></div>`};
const tRounds=()=>cfg?rounds.filter(r=>r.tid===cfg.tid):[];
const hands=i=>tRounds().filter(r=>r.table===i&&r.rd===cfg.round);
function totals(rs){const t={};rs.forEach(r=>{for(const p in r.d)t[p]=(t[p]||0)+r.d[p]});return t}
const pad=n=>String(n).padStart(2,'0');
const tmS=()=>cfg.tm||{run:true,left:(limT()||cfg.limit.v||0)*60000,at:cfg.start,go:true};
const msLeft=()=>{const s=tmS();return Math.max(0,s.run?s.left-(Date.now()-s.at):s.left)};
const tmIdle=()=>({run:false,left:(limT()||cfg.limit.v||0)*60000,at:0,go:false});
const fmtMs=ms=>Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60);
const isH=()=>!!(myT[cur]&&myT[cur].host);
const tmLbl=()=>{const s=tmS();return s.run?'':(s.go?'⏸ Pauze':'Laiks vēl nav sākts')};
function pieD(f,r,c){if(f<=0.0005)return '';if(f>=0.9995)return `M${c-r} ${c}A${r} ${r} 0 1 1 ${c+r} ${c}A${r} ${r} 0 1 1 ${c-r} ${c}Z`;
const a=-Math.PI/2+f*2*Math.PI;return `M${c} ${c}L${c} ${c-r}A${r} ${r} 0 ${f>0.5?1:0} 1 ${c+r*Math.cos(a)} ${c+r*Math.sin(a)}Z`}
function pie(sz){const r=sz/2-3,c=sz/2,f=Math.min(1,msLeft()/(((limT()||cfg.limit.v||0)*60000)||1));
return `<svg class=pie width=${sz} height=${sz} viewBox="0 0 ${sz} ${sz}" data-r="${r}" data-c="${c}" style="flex:none"><circle cx=${c} cy=${c} r=${r} fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="2"/><path class=pm fill="currentColor" d="${pieD(f,r,c)}"/></svg>`}
function tick(){if(!cfg||!cfg.limit)return;
document.querySelectorAll('.tm').forEach(e=>{if((cfg.limit.k!=='t'&&cfg.limit.k!=='ht'))return;const ms=msLeft(),big=e.parentNode&&e.parentNode.className==='bigtm';e.textContent=ms?Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60):'0:00';e.style.color=ms<60000?'var(--neg)':''});
if((cfg.limit.k==='t'||cfg.limit.k==='ht')){const ms=msLeft(),f=Math.min(1,ms/((cfg.limit.v*60000)||1));document.querySelectorAll('svg.pie').forEach(v=>{const p=v.querySelector('.pm');if(p)p.setAttribute('d',pieD(f,+v.dataset.r,+v.dataset.c));v.style.color=ms<60000?'var(--neg)':''})}
if((cfg.limit.k==='t'||cfg.limit.k==='ht')){const e=msLeft()===0;if(wasEnd!==null&&e!==wasEnd){wasEnd=e;if(['table','tv','host'].includes(view))render()}else wasEnd=e}}
const limH=()=>{const L=cfg&&cfg.limit||{};return (L.k==='h'||L.k==='ht')?(L.h||L.v||0):0};
const limT=()=>{const L=cfg&&cfg.limit||{};return (L.k==='t'||L.k==='ht')?(L.t||L.v||0):0};
const prog=i=>{const h=limH();return h?`${hands(i).length}/${h} partijas`:`${hands(i).length} partijas`};
const done=i=>{const h=limH();return h>0&&hands(i).length>=h};
// ---- sēdināšana ----
function layout(n){const t=Math.floor(n/3),r=n%3;if(t<1||r>t)return null;return Array.from({length:t},(_,i)=>i<r?4:3)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seat(o){const lay=layout(o.length);let i=0;return lay.map((s,k)=>({n:'Galds '+(k+1),players:o.slice(i,i+=s)}))}
function lkc(){const h=$('#lkH')&&$('#lkH').checked,t=$('#lkT')&&$('#lkT').checked;if($('#lv'))$('#lv').style.display=h?'':'none';if($('#lt'))$('#lt').style.display=t?'':'none';if($('#tr'))$('#tr').disabled=$('#tnl')&&$('#tnl').checked}
function lpv(){const pl=[...new Set($('#tp').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))],l=layout(pl.length);
$('#lp').innerHTML=!pl.length?'':l?`${pl.length} spēlētāji → ${l.length} galdi (${l.map(x=>x).join('+')})`:`<span class=n>${pl.length} spēlētāji: nevar sadalīt pa 3–4 (vajag 3, 4 vai 6 un vairāk)</span>`}
// ---- sākums ----

let archList=null,archView=null;
function loadArch(){fetch('/api/archive').then(r=>r.json()).then(l=>{archList=l||[];render()}).catch(()=>{archList=[];render()})}
function histListV(){return hdr('Turnīru vēsture')+(archList===null?'<div class=card>Ielādē…</div>':(archList.length?archList.map(a=>`<button class=big onclick="openArch('${a.id}')"><b>${esc(a.name)}</b><br><small>${a.players.length} spēlētāji · ${a.rounds} partijas · ${fmtT(a.savedAt)}</small></button>`).join(''):'<div class="card mu">Vēl nav saglabātu turnīru. Rīkotāja panelī spied „Beigt turnīru un saglabāt”.</div>'))}
function openArch(id){fetch('/api/archive/'+id).then(r=>r.ok?r.json():Promise.reject()).then(a=>{archView=a;view='histmenu';render();scrollTo(0,0)}).catch(()=>alert('Neizdevās ielādēt'))}
function openArchView(v){if(!archView)return;cfg=archView.cfg||null;rounds=archView.rounds||[];if(cfg&&!cfg.tid&&archView.tid)cfg={...cfg,tid:archView.tid};view=v;render();scrollTo(0,0)}
function histMenuV(){if(!archView)return hdr('Turnīrs')+'<div class=card>Nav datu</div>';
const a=archView,rs=a.rounds||[],pl=(a.cfg&&a.cfg.players)||a.players||[],host=isArchHost(a);
return hdr(a.name||'Turnīrs')+`<p class=mu style="margin:8px 0">Saglabāts ${fmtT(a.savedAt)} · ${pl.length} spēlētāji · ${rs.length} partijas</p>
<button class=big onclick="openArchView('histtv')">Pilnā tabula<br><small>Visu spēlētāju rezultāti</small></button>
<button class=big onclick="openArchView('histstats')">Statistika<br><small>Cik reižu izspēlēta zole, mazā zole u.c.</small></button>
${host?`<button class=pri style="width:100%;margin-top:14px" onclick="restoreArch('${a.id}')">Atjaunot kā aktīvu turnīru</button>
<button class=danger style="width:100%" onclick="delArch('${a.id}')">Dzēst no vēstures</button>`:
`<button style="width:100%;margin-top:14px" onclick="claimArchHost('${a.id}')">Rīkotāja darbības…</button>
<small class=mu>Dzēst vai atjaunot var tikai rīkotājs (vai admin). Spied, lai ievadītu rīkotāja paroli.</small>`}`}
function histViewV(){if(!archView)return hdr('Turnīrs')+'<div class=card>Nav datu</div>';
const a=archView,cfgA=a.cfg||{},rs=a.rounds||[];
const St=(function(){const lp={},sm={};(cfgA.players||[]).forEach(p=>{lp[p]=0;sm[p]=0});
rs.forEach(r=>{if(!r.d)return;for(const p in r.d){sm[p]=(sm[p]||0)+r.d[p]}});
/* large points approx from table ranks if needed — show small pts sum */
const names=(cfgA.players||[]).slice().sort((x,y)=>(sm[y]||0)-(sm[x]||0));
return {lp,sm,names}})();
const rows=St.names.map((p,i)=>`<tr style="border-top:1px solid var(--bd)"><td style="text-align:left;padding:8px 6px"><b>${i+1}. ${esc(p)}</b></td><td style="color:${(St.sm[p]||0)<0?'var(--neg)':'var(--gd)'};font-weight:700">${fmt(St.sm[p]||0)}</td></tr>`).join('');
return `<div class=bar><button onclick="go('hist')">←</button><b>${esc(a.name)}</b></div>
<div class=card><p class=mu>Saglabāts ${fmtT(a.savedAt)} · ${rs.length} partijas · ${(cfgA.players||[]).length} spēlētāji</p>
<table style="width:100%;border-collapse:collapse;text-align:center"><tr class=mu><th style="text-align:left">Spēlētājs</th><th>Mazie punkti</th></tr>${rows||'<tr><td colspan=2 class=mu>Nav datu</td></tr>'}</table>
<button class=danger style="margin-top:12px" onclick="delArch('${a.id}')">Dzēst no vēstures</button>
<small class=mu>Dzēšanai nepieciešama rīkotāja parole (tā, kas tika iestatīta, veidojot turnīru).</small></div>`}
function delArch(id){if(!confirm('Dzēst turnīru no vēstures neatgriezeniski?'))return;
const isAdm=adm&&adm.pw;const pw=isAdm?adm.pw:prompt('Rīkotāja parole:');if(!pw)return;
fetch('/api/archive/'+id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(r=>{if(!r.ok)return Promise.reject();const ah=ls.get('archHost',{})||{};delete ah[id];ls.set('archHost',ah);archView=null;go('hist');loadArch()}).catch(()=>alert('Neizdevās dzēst (nepareiza parole?)'))}
function restoreArch(id){if(!confirm('Atjaunot turnīru kā aktīvu? Tas atkal parādīsies turnīru sarakstā.'))return;
const isAdm=adm&&adm.pw;const pw=isAdm?adm.pw:prompt('Rīkotāja parole:');if(!pw)return;
fetch('/api/archive/'+id+'/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{const ah=ls.get('archHost',{})||{};delete ah[id];ls.set('archHost',ah);myT[d.tid]={token:d.token,host:d.host,name:d.name};ls.set('myT',myT);archView=null;enterT(d.tid)}).catch(()=>alert('Neizdevās atjaunot (nepareiza parole vai turnīrs ar šo ID jau aktīvs)'))}
function homeV(){return `<div class=hero><div class=suits>♠ ♥ ♣ ♦</div><h1>Zole</h1><p>Pieraksti zoles punktus digitāli</p></div>
<button class="big pri" onclick="go('solo')"><b class=ic>✎</b>Pierakstīt <br><small style="color:inherit">tikai šajā ierīcē, vairāki galdi</small></button>
${SRV?`<div class=home-split>
<div class=home-hist><div class=lbl>Vēsture</div><button class=big onclick="go('hist')">Turnīru vēsture <br><small>Beigtie un saglabātie turnīri</small></button></div>
<div class=home-main><div class=lbl>Turnīrs</div><button class=big onclick="go('tcreate')">Izveidot turnīru <br><small>Spēlētāji, galdi un kārtas</small></button>${tlist()}</div>
</div>`:'<div class="card mu" style="margin-top:18px"><small>Turnīra režīms ir pieejams, kad lapa ir palaista uz sava servera (Render vai dators).</small></div>'}
<div class=ver onclick="adminOpen()" style="cursor:pointer;padding:8px">Versija ${VERSION}</div>`}
// ---- admin ----
function adminOpen(){if(!SRV)return;adm={};go('admin')}
function adminV(){return hdr('Admin')+(adm.list?`<small class=mu>Aktīvie turnīri (${adm.list.length}). „Ieiet” atver turnīru ar pilnām rīkotāja tiesībām.</small>`+(adm.list.length?adm.list.map(t=>`<div class=card><b>${esc(t.name)}</b><br><small class=mu>${t.players} spēlētāji · ${t.round}. kārta · ${t.hands} partijas</small><br><button class=pri style="margin-top:8px" onclick="adminEnter('${t.tid}')">Ieiet kā rīkotājs</button></div>`).join(''):'<div class="card mu">Nav aktīvu turnīru.</div>')+`<button onclick="adminLogin(1)">Atjaunot sarakstu</button>`:`<div class=card><div class=lbl>Admin parole</div><input id=ap type=password placeholder="Parole" autocomplete="off"><button class=pri onclick="adminLogin()" style="width:100%;margin-top:8px">Ieiet</button></div>`)}
function adminLogin(again){const pw=again?adm.pw:$('#ap').value;fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(r=>r.status===200?r.json():Promise.reject(new Error(r.status===403?'Nepareiza admin parole':r.status===404?'Admin režīms nav ieslēgts serverī (nav iestatīta ADMIN_PASSWORD)':r.status===429?'Pārāk daudz mēģinājumu, pamēģini vēlāk':'servera kļūda '+r.status))).then(d=>{adm={pw,list:d.list};render()}).catch(e=>alert(e.message))}
function adminEnter(tid){fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adm.pw,tid})}).then(r=>r.ok?r.json():Promise.reject(new Error('Neizdevās ieiet'))).then(d=>{myT[tid]={token:d.token,host:d.host,name:d.name};ls.set('myT',myT);enterT(tid)}).catch(e=>alert(e.message))}
// ---- izveidot turnīru ----
function createV(){return hdr('Izveidot turnīru')+`<div class=card>
<div class=lbl>Nosaukums</div><input id=tn placeholder="Zoles turnīrs">
<div class=lbl>Parole (to ievadīs spēlētāji, lai pievienotos)</div><input id=tw placeholder="Vismaz 3 simboli" autocomplete="off">
<div class=lbl>Rīkotāja parole (lai vēlāk pieslēgtos kā rīkotājs no citas ierīces)</div><input id=th placeholder="Vismaz 3 simboli, atšķirīga no pirmās" autocomplete="off">
<div class=lbl>Spēlētāji (katrs savā rindā vai ar komatu)</div><textarea id=tp rows=7 oninput="lpv()" placeholder="Anna&#10;Jānis&#10;Māra&#10;..."></textarea><div id=lp class=mu></div>
<div class=lbl>Kārta beidzas</div>
<label style="display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer"><input id=lkH type=checkbox style="width:auto;margin:0" checked onchange="lkc()"> Partiju skaits galdā</label>
<input id=lv type=number min=1 value=24 style="width:100%;margin-bottom:6px">
<label style="display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer"><input id=lkT type=checkbox style="width:auto;margin:0" onchange="lkc()"> Laiks (minūtes)</label>
<input id=lt type=number min=1 value=60 style="width:100%;margin-bottom:6px;display:none">
<small class=mu>Var ieslēgt abas — kārta beidzas, kad sasniegts partiju limits vai beidzas laiks.</small>
<div class=lbl>Kārtu skaits</div><div class=bar><input id=tr type=number min=1 value=7 style="flex:1"><label style="display:flex;align-items:center;gap:6px;white-space:nowrap"><input id=tnl type=checkbox style="width:auto;margin:0" onchange="lkc()"> bez limita</label></div>
<div class=lbl>Lielie punkti galdā (pa vietām)</div><div class=bar>${[6,4,2,0].map((v,i)=>`<label style="flex:1;font-size:12px;color:var(--mu)">${i+1}. vieta<input id=lq${i} type=number step=any inputmode=decimal value=${v}></label>`).join('')}</div>
<small class=mu>Ja rezultāts ir neizšķirts, attiecīgo vietu punkti tiek sadalīti vienādi. 3 spēlētāju galdā tiek izmantotas pirmās 3 vietas, 4 spēlētāju galdā visas 4.</small></div>
${rin(DEF)}
<button class=pri onclick="createT()" style="width:100%">Izveidot turnīru (1. kārta, nejauša sēdināšana)</button>`}
function createT(){const pl=[...new Set($('#tp').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))];
if(!layout(pl.length))return alert('Vajag 3, 4 vai vismaz 6 spēlētājus (pa 3, pārpalikums pa 4).');
const pw=$('#tw').value.trim(),hp=$('#th').value.trim();if(pw.length<3||hp.length<3)return alert('Ievadi abas paroles (vismaz 3 simboli katra).');if(pw===hp)return alert('Rīkotāja parolei jābūt citādai nekā spēlētāju parolei.');
const rules=readRules();if(!rules)return;
const lp=[0,1,2,3].map(i=>parseFloat(String($('#lq'+i).value).replace(',','.')));if(lp.some(x=>!isFinite(x)))return alert('Ievadi lielos punktus visām 4 vietām (skaitļus).');
const useH=$('#lkH')&&$('#lkH').checked,useT=$('#lkT')&&$('#lkT').checked;const hv=Math.max(1,parseInt($('#lv')&&$('#lv').value)||24),tv=Math.max(1,parseInt($('#lt')&&$('#lt').value)||60);const lk=!useH&&!useT?'n':useH&&useT?'ht':useH?'h':'t';
const c={name:$('#tn').value.trim()||'Zoles turnīrs',players:pl,limit:{k:lk,v:lk==='t'?tv:lk==='n'?0:hv,h:useH?hv:0,t:useT?tv:0},rules,round:1,total:$('#tnl').checked?0:Math.max(1,parseInt($('#tr').value)||7),start:Date.now(),lp,tables:seat(shuffle(pl))};
if(useT)c.tm={run:false,left:tv*60000,at:0,go:false};

function limLabel(lk){

  if(lk.k==='h'||lk.k==='ht')parts.push((lk.h||lk.v)+' partijas katrā galdā');
  if(lk.k==='t'||lk.k==='ht')parts.push((lk.t||lk.v)+' minūtes (laiks sākas tikai tad, kad nospied „Sākt”)');
  return parts.join(' · ')||'—';
}

const B=(on,k,v,l)=>`<button class="${on?'on':''}" onclick="hs('${k}',${v})">${esc(l)}</button>`;
return `<div class=card><h3>Jauna partija</h3>${R().mode==='P'?`<div class=lbl>Pules uz galda: <b>${pool(H.rs)}</b></div>`:''}
${pl.length>3?`<div class=lbl>Dalītājs (nespēlē) <button onclick="H.chg=!H.chg;render()" style="min-height:0;padding:4px 10px">mainīt</button></div>${H.chg?pl.map((p,i)=>B(H.dealer===i,'dealer',i,p)).join(''):`<b>${esc(pl[H.dealer])}</b>`}`:''}
${!['Custom','Pule'].includes(H.g)?`<div class=lbl>${H.g==='Galdiņš'?'Kas zaudēja':'Kas spēlēja (lielais)'}</div>${P.map(p=>B(H.main===p,'main',pl.indexOf(p),p)).join('')}`:''}
<div class=lbl>Spēle</div>${Object.keys(GM()).map((g,i)=>B(H.g===g,'g',i,gl(g))).join('')}
${H.g&&!['Custom','Pule'].includes(H.g)?`<div class=lbl>Rezultāts (spēlētājs / katrs pārējais)</div>${GM()[H.g].map((o,i)=>B(H.o===i,'o',i,o[0]+' ('+fmt(o[1]*R().opp*(pl.length-1))+' / '+fmt(-o[1]*R().opp)+')')).join('')}`:''}
${H.g==='Custom'?`<div class=lbl>Punkti katram spēlētājam</div>${pl.map(p=>`<div class=bar><span style="flex:1">${esc(p)}</span><input style="width:110px" type=number step=any inputmode=decimal value="${H.c[p]??''}" oninput="H.c[${JSON.stringify(p).replace(/"/g,'&quot;')}]=this.value;upd()"></div>`).join('')}`:''}
<div id=pv>${pvH(d)}</div>
<button class=pri ${d?'':'disabled'} id=sv onclick="hsave()" style="width:100%;margin-top:8px">Saglabāt partiju</button></div>`}
function pvH(d){return d?Object.entries(d).map(([p,v])=>`${esc(p)} <b class="${v<0?'n':''}">${fmt(v)}</b>`).join(' · '):'<span class=mu>Aizpildi laukus augstāk</span>'}
function upd(){const d=deltas();$('#pv').innerHTML=pvH(d);$('#sv').disabled=!d}
function hs(k,v){if(!H){render();return}if(k==='dealer'){H.dealer=v;if(H.main===H.pl[v])H.main=null}else if(k==='main')H.main=H.pl[v];else if(k==='g'){H.g=Object.keys(GM())[v];H.o=null}else H.o=v;render()}
function deltas(){const pl=H.pl,n=pl.length,d={};H.plc=0;if(n>3&&H.dealer<0)return null;
if(H.g==='Custom'){if(pl.every(p=>H.c[p]===undefined||H.c[p]===''))return null;pl.forEach(p=>d[p]=+H.c[p]||0);return d}
if(H.g==='Pule'){pl.forEach(p=>d[p]=-1);H.plc=1;return d}
if(!H.g||H.main==null||H.o==null)return null;const v=GM()[H.g][H.o][1],o=R().opp;
pl.forEach(p=>d[p]=p===H.main?v*o*(n-1):-v*o);
if(R().mode==='P'&&H.g==='Lielais'&&pool(H.rs)>0){d[H.main]+=v>0?n:-n;H.plc=v>0?-1:1}
return d}
function hsave(){if(!H)return render();const d=deltas();if(!d)return;window[saver]({t:Date.now(),dl:H.pl[H.dealer],m:H.main||undefined,g:H.g,o:(H.g==='Custom'||H.g==='Pule')?H.g:GM()[H.g][H.o][0],d,pl:H.plc||undefined})}
loadList();render();
</script></body></html>
