<!doctype html><html lang="lv"><head><meta charset="utf-8"><title>Zole</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ee;--fg:#1d2a22;--card:#fff;--ac:#1f6b47;--on:#fff;--mu:#6b756e;--bd:#dcd8cc;--neg:#b3392f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a15;--fg:#e8efe9;--card:#1c2620;--ac:#4fc08a;--on:#08140d;--mu:#93a198;--bd:#2f3b34;--neg:#ff8277}}
:root[data-theme=dark]{--bg:#121a15;--fg:#e8efe9;--card:#1c2620;--ac:#4fc08a;--on:#08140d;--mu:#93a198;--bd:#2f3b34;--neg:#ff8277}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}
h1{margin:6px 0 2px}h3{margin:0 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:4px 4px 4px 0;min-height:46px;cursor:pointer}
button:disabled{opacity:.45}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.big{display:block;width:100%;text-align:left;margin:8px 0;padding:16px}
input,textarea,select{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:11px;margin:4px 0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px}.bar b{flex:1;font-size:18px}
.sb{display:flex;gap:8px}.sb>div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.sb b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}.sb span{font-size:30px;font-weight:700}
.n{color:var(--neg)}.h{padding:8px 0;border-bottom:1px solid var(--bd)}
.lbl{margin:10px 0 2px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;background:var(--ac);color:var(--on);border-radius:99px;padding:4px 12px;font-weight:600;margin:4px 6px 4px 0}
.tv{padding:22px}.tv h1{font-size:clamp(28px,4vw,52px)}
.cols{column-width:420px;column-gap:20px}
.row{break-inside:avoid;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:0 0 10px;font-size:clamp(20px,2.4vw,34px)}
.row .r{width:2.2em;font-weight:800;color:var(--ac)}.row .p{flex:1}.row small{font-size:.5em}.row .s{font-weight:800}
.g1 .r{font-size:1.3em}
.sb .hd{display:block;font-size:18px;font-weight:400;line-height:1;padding:4px 0 6px;touch-action:none;cursor:grab;user-select:none;color:var(--mu)}
.up{color:#2fb36b;font-size:.6em}.dn{color:var(--neg);font-size:.6em}
.tv{padding:12px}.tv .row{margin:0;font-size:inherit;padding:0 14px}.tv .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:var(--bg)}
.hd{font-size:22px;touch-action:none;cursor:grab;padding:0 8px;user-select:none}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=n=>(n>0?'+':'')+(Math.round(n*10)/10);
// Punkti: [nosaukums, punkti spēlētājam]; pretinieki saņem pretējo zīmi (pusi vai visu).
const BASE={"Lielais":[["Uzvara 61–90",2],["Uzvara 91+ (jaņi)",4],["Uzvara visi stiķi",6],["Zaudējums 31–60",-4],["Zaudējums ≤30",-6],["Zaudējums, nav stiķu",-8]],
"Zole":[["Uzvara 61–90",10],["Uzvara 91+ (jaņi)",12],["Uzvara visi stiķi",14],["Zaudējums 31–60",-12],["Zaudējums ≤30",-14],["Zaudējums, nav stiķu",-16]],
"Mazā zole":[["Uzvara",12],["Zaudējums",-14]],
"Galdiņš":[["Zaudētājs",-4]]};
const mk=(m,...k)=>({mode:m,opp:0.5,games:Object.fromEntries(k.map(x=>[x,BASE[x]]))});
const PRE={MG:mk('MG','Lielais','Zole','Mazā zole','Galdiņš'),G:mk('G','Lielais','Zole','Galdiņš'),P:mk('P','Lielais','Zole','Mazā zole')};
const DEF=PRE.MG;
const R=()=>(view==='solo'?solo.rules:cfg&&cfg.rules)||DEF;
const GM=()=>Object.assign({},R().games,R().mode==='P'?{"Pule":[]}:{},{"Custom":[]});
const gl=g=>g==='Custom'?'Cits (ievadi pats)':g==='Pule'?'Visi nopasē (pule)':g;
const pool=rs=>rs.reduce((a,r)=>a+(r.pl||0),0);
const LV=new Intl.DateTimeFormat();
function LDBmake(){let st=null,lc=[],lr=[];
const post=(u,b,m)=>fetch(u,{method:m||'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error('servera kļūda '+r.status)});
const sc=()=>({exists:!!st.cfg,data:()=>st.cfg}),sr=()=>({docs:st.rounds.map(r=>({id:r.id,data:()=>r}))});
const es=new EventSource('/events');es.onmessage=e=>{st=JSON.parse(e.data);lc.forEach(f=>f(sc()));lr.forEach(f=>f(sr()))};
return {doc:()=>({onSnapshot(f){lc.push(f);if(st)f(sc())},set:o=>post('/api/cfg',o)}),
 collection:()=>({onSnapshot(f){lr.push(f);if(st)f(sr())},add:o=>post('/api/rounds',o),doc:id=>({delete:()=>post('/api/rounds/'+id,null,'DELETE')})})}}
let db=null,cfg=null,rounds=[],view='home',H=null,tbl=ls.get('tbl',null),solo=ls.get('solo',{players:[],rounds:[]});
db=LDBmake();
db.doc("t/cfg").onSnapshot(s=>{const d=s.exists?s.data():null;cfg=d&&d.limit?d:null;hr()});
db.collection("rounds").onSnapshot(s=>{rounds=s.docs.map(d=>({id:d.id,...d.data()}));hr()});
setInterval(tick,1000);
function hr(){if(view==='host'){const e=$('#hs');if(e)e.innerHTML=hostStat();tick()}else render()}

function go(v){view=v;H=null;render();scrollTo(0,0)}
function render(){const f={home:homeV,solo:soloV,tv:tvV,table:tableV,host:hostV}[view];$('#app').innerHTML=f();tick()}
const hdr=t=>`<div class=bar><button onclick="go('home')">←</button><b>${esc(t)}</b></div>`;
const tRounds=()=>cfg?rounds.filter(r=>r.tid===cfg.tid):[];
const hands=i=>tRounds().filter(r=>r.table===i&&r.rd===cfg.round);
function totals(rs){const t={};rs.forEach(r=>{for(const p in r.d)t[p]=(t[p]||0)+r.d[p]});return t}
const pad=n=>String(n).padStart(2,'0');
const msLeft=()=>Math.max(0,cfg.start+cfg.limit.v*60000-Date.now());
function tick(){document.querySelectorAll('.tm').forEach(e=>{if(!cfg||cfg.limit.k!=='t')return;const ms=msLeft();e.textContent=ms?Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60):'laiks beidzies'})}
const prog=i=>cfg.limit.k==='h'?`${hands(i).length}/${cfg.limit.v} partijas`:`<span class=tm></span> · ${hands(i).length} partijas`;
const done=i=>cfg.limit.k==='h'&&hands(i).length>=cfg.limit.v;

// ---- sēdināšana ----
function layout(n){const t=Math.floor(n/3),r=n%3;if(t<1||r>t)return null;return Array.from({length:t},(_,i)=>i<r?4:3)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seat(o){const lay=layout(o.length);let i=0;return lay.map((s,k)=>({n:'Galds '+(k+1),players:o.slice(i,i+=s)}))}
function lpv(){const pl=[...new Set($('#tp').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))],l=layout(pl.length);
 $('#lp').innerHTML=!pl.length?'':l?`${pl.length} spēlētāji → ${l.length} galdi (${l.map(x=>x).join('+')})`:`<span class=n>${pl.length} spēlētāji: nevar sadalīt pa 3–4 (vajag 3, 4 vai 6 un vairāk)</span>`}

// ---- sākums ----
function homeV(){return `<h1>🃏 Zole</h1><p class=mu>Punktu pieraksts īstām kāršu spēlēm.</p>
<button class="big pri" onclick="go('solo')">Spēle ar draugiem <br><small style="color:inherit">tikai šajā ierīcē</small></button>
<div class=lbl>Turnīrs</div>
<button class=big onclick="go('table')">Galda ierīce <br><small>Ievadi punktus pie sava galda</small></button>
<button class=big onclick="go('tv')">TV tabula <br><small>Liels ekrāns ar rezultātiem</small></button>
<button class=big onclick="go('host')">Rīkotājs <br><small>Izveido turnīru, sāc nākamo kārtu</small></button>`}

// ---- rīkotājs ----
function hostStat(){const c=cfg;let st='';
 if(c){st=`<div class=card><h3>${esc(c.name)} · ${c.round}. kārta</h3><p class=mu>${c.limit.k==='h'?c.limit.v+' partijas katrā galdā':c.limit.v+' minūtes'} · atlicis: ${c.limit.k==='t'?'<span class=tm></span>':'—'}</p>
 ${c.tables.map((t,i)=>`<div class=h><b>${esc(t.n)}</b> · <small>${prog(i)}${done(i)?' ✅':''}</small><br>${t.players.map(esc).join(', ')}</div>`).join('')}
 <button class=pri style="margin-top:10px" onclick="nextRound()">Sākt ${c.round+1}. kārtu (pēc rezultātiem)</button></div>`}
 return st}
function hostV(){const c=cfg;
 return hdr('Rīkotājs')+`<div id=hs>${hostStat()}</div>`+`<details class=card ${c?'':'open'}><summary><b>${c?'Jauns turnīrs':'Izveidot turnīru'}</b></summary>
<div class=lbl>Nosaukums</div><input id=tn placeholder="Zoles turnīrs">
<div class=lbl>Spēlētāji (katrs savā rindā vai ar komatu)</div><textarea id=tp rows=7 oninput="lpv()" placeholder="Anna&#10;Jānis&#10;Māra&#10;..."></textarea><div id=lp class=mu></div>
<div class=lbl>Kārta beidzas</div><div class=bar><select id=lk style="flex:1"><option value=h>pēc partiju skaita galdā</option><option value=t>pēc laika (minūtes)</option></select><input id=lv type=number min=1 value=8 style="width:90px"></div>
${rin(DEF)}
<button class=pri onclick="hostStart()" style="width:100%">Sākt turnīru (1. kārta, nejauša sēdināšana)</button></details>`}
function hostStart(){const pl=[...new Set($('#tp').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))];
 if(!layout(pl.length))return alert('Vajag 3, 4 vai vismaz 6 spēlētājus (pa 3, pārpalikums pa 4).');
 const rules=readRules();if(!rules)return;
 if(cfg&&!confirm('Sākt jaunu turnīru? Esošais turnīrs tiks aizvietots.'))return;
 db.doc("t/cfg").set({tid:Date.now().toString(36),name:$('#tn').value.trim()||'Zoles turnīrs',players:pl,limit:{k:$('#lk').value,v:Math.max(1,parseInt($('#lv').value)||1)},rules,round:1,start:Date.now(),tables:seat(shuffle(pl))}).then(()=>go('host')).catch(e=>alert('Neizdevās: '+e.message))}
function nextRound(){const t=totals(tRounds());if(!confirm('Sākt '+(cfg.round+1)+'. kārtu? Spēlētājus sēdinās pēc līdzšinējiem rezultātiem: stiprākie kopā, vājākie kopā.'))return;
 const o=shuffle(cfg.players).sort((a,b)=>(t[b]||0)-(t[a]||0));
 db.doc("t/cfg").set({...cfg,hist:[...(cfg.hist||[]),{round:cfg.round,tables:cfg.tables}],round:cfg.round+1,start:Date.now(),tables:seat(o)}).catch(e=>alert('Neizdevās: '+e.message))}

// ---- TV ----
let tvSel='t';
function tvs(x){tvSel=x;render()}
function tfs(){const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen()}
function arrows(L){const now={},res={},cr=tRounds().filter(r=>r.rd===cfg.round);L.forEach(x=>now[x.p]=x.s);
 const rank=(m,p)=>1+L.filter(x=>m[x.p]>m[p]).length;
 cfg.tables.forEach((tb,i)=>{const h=cr.filter(r=>r.table===i).sort((a,b)=>a.t-b.t),last=h[h.length-1];if(!last)return;
  const prev={...now};for(const p in last.d)if(p in prev)prev[p]-=last.d[p];
  tb.players.forEach(p=>{const a=rank(prev,p),b=rank(now,p);res[p]=a>b?1:a<b?-1:0})});
 return res}
function tvV(){if(!cfg)return hdr('TV')+'<div class=card>Turnīrs vēl nav izveidots. Izveido to sadaļā Rīkotājs.</div>';
 const rd=tvSel==='t'?null:+tvSel,all=tRounds(),rs=rd?all.filter(r=>r.rd===rd):all,t=totals(rs);
 const tabs=rd&&rd!==cfg.round?((cfg.hist||[]).find(h=>h.round===rd)||cfg).tables:cfg.tables;
 const L=[];tabs.forEach((tb,i)=>tb.players.forEach(p=>L.push({p,i,s:t[p]||0})));
 L.sort((a,b)=>b.s-a.s);const ar=rd?{}:arrows(L);
 const n=L.length,cols=Math.min(4,Math.max(1,Math.ceil(n/12))),R=Math.ceil(n/cols),fs=Math.max(11,Math.min((innerHeight-190)/R*.46,innerWidth/cols*.06));
 const chips=['t',...Array.from({length:cfg.round},(_,k)=>k+1)].map(x=>`<button class="${String(x)===String(tvSel)?'on':''}" style="min-height:0;padding:6px 14px" onclick="tvs('${x}')">${x==='t'?'Kopā':x+'. kārta'}</button>`).join('');
 return `<div class=tv style="margin:-14px;height:100vh;display:flex;flex-direction:column"><div class=bar><button onclick="go('home')">←</button><b style="font-size:clamp(22px,3vw,44px)">🃏 ${esc(cfg.name)}</b>${cfg.limit.k==='t'?'<span class=chip><span class=tm></span></span>':''}<button onclick="tfs()">⛶</button></div>
<div style="margin:6px 0">${chips}</div>
<div style="flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(${R},1fr);grid-template-columns:repeat(${cols},1fr);gap:6px 14px;font-size:${fs}px">${L.map(x=>{const r=L.findIndex(y=>y.s===x.s)+1,a=ar[x.p];return `<div class="row ${r<=3?'g1':''}"><span class=r>${r}.</span><span class=p>${esc(x.p)}${a===1?' <span class=up>▲</span>':a===-1?' <span class=dn>▼</span>':''} <small class=mu>${esc(tabs[x.i].n)}</small></span><span class="s ${x.s<0?'n':''}">${fmt(x.s)}</span></div>`}).join('')}</div>
<small class=mu style="margin-top:6px">${rd?rd+'. kārta':'Kopā'} · ${cfg.round}. kārta notiek: ${cfg.tables.map((tb,i)=>esc(tb.n)+' '+prog(i)).join(' · ')}</small></div>`}
window.addEventListener('resize',()=>{if(view==='tv')render()});

// ---- galda ierīce ----
function tableV(){if(!cfg)return hdr('Galds')+'<div class=card>Turnīrs vēl nav izveidots. Pagaidi rīkotāju.</div>';
 if(tbl==null||!cfg.tables[tbl])return hdr('Izvēlies savu galdu')+cfg.tables.map((t,i)=>`<button class=big onclick="pick(${i})"><b>${esc(t.n)}</b><br><small>${t.players.map(esc).join(', ')}</small></button>`).join('');
 const T=cfg.tables[tbl],rs=hands(tbl).sort((a,b)=>a.t-b.t),dn=cfg.tables.filter((_,i)=>done(i)).length;
 return `<div class=bar><button onclick="go('home')">←</button><b>${esc(T.n)} · ${cfg.round}. kārta</b><button onclick="pick(null)">Mainīt</button></div>
<div class=card><small>${prog(tbl)}</small>${done(tbl)?'<br><b>✅ Kārtas norma izpildīta.</b> Vari turpināt, nākamo kārtu sāks rīkotājs.':''}${cfg.limit.k==='h'?`<br><small>${dn}/${cfg.tables.length} galdi gatavi</small>`:''}</div>
${board(T.players,rs,'ordT')}${hand(T.players,'saveT',rs)}${hist(rs,'undoT()')}`}
function pick(i){tbl=i;ls.set('tbl',i);render()}
function saveT(rec){rec.tid=cfg.tid;rec.table=tbl;rec.rd=cfg.round;db.collection("rounds").add(rec).then(()=>{H=null;render()}).catch(e=>alert('Neizdevās saglabāt: '+(e.message||e.code)))}
function undoT(){const rs=hands(tbl).sort((a,b)=>b.t-a.t);if(rs[0]&&confirm('Dzēst pēdējo partiju?'))db.collection("rounds").doc(rs[0].id).delete().catch(e=>alert(e.message))}

// ---- spēle ar draugiem ----
function soloV(){const s=solo;
 if(!s.players.length)return hdr('Spēle ar draugiem')+`<div class=card><p>Spēlētāji (3 vai 4)</p>${[0,1,2,3].map(i=>`<input id=n${i} placeholder="${i+1}. spēlētājs${i>2?' (nav obligāti)':''}">`).join('')}</div>${rin(DEF)}<button class=pri style="width:100%" onclick="soloStart()">Sākt</button>`;
 return hdr('Spēle ar draugiem')+board(s.players,s.rounds,'ordS')+hand(s.players,'saveS',s.rounds)+hist(s.rounds,'undoS()')+`<button onclick="soloNew()">Jauna spēle</button>`}
function soloStart(){const p=[0,1,2,3].map(i=>$('#n'+i).value.trim()).filter(Boolean);if(p.length<3||new Set(p).size!==p.length)return alert('Ievadi 3–4 dažādus vārdus.');const rules=readRules();if(!rules)return;solo={players:p,rounds:[],rules};ls.set('solo',solo);render()}
function saveS(rec){solo.rounds.push(rec);ls.set('solo',solo);H=null;render()}
function undoS(){if(solo.rounds.length&&confirm('Dzēst pēdējo partiju?')){solo.rounds.pop();ls.set('solo',solo);render()}}
function soloNew(){if(confirm('Notīrīt spēlētājus un rezultātus?')){solo={players:[],rounds:[]};ls.set('solo',solo);render()}}

function board(pl,rs,fn){const t=totals(rs);return `<div class=sb id=ol data-fn="${fn}">${pl.map((p,i)=>`<div data-i="${i}"><span class=hd onpointerdown="dgS(event,this)" onpointermove="dgM(event)" onpointerup="dgE()" onpointercancel="dgE()">⠿</span><b>${esc(p)}</b><span class="${(t[p]||0)<0?'n':''}">${fmt(t[p]||0)}</span></div>`).join('')}</div><small class=mu>Velc ⠿, lai mainītu sēdvietu secību (dalītājs mainās pēc tās).</small>`}
function hist(rs,u){return `<div class=card><h3>Partijas (${rs.length})</h3>${rs.slice().reverse().map((r,i)=>`<div class=h>#${rs.length-i} · ${esc(r.g==='Custom'?'Cits':r.g==='Pule'?'Visi nopasē (pule)':r.g)}${r.o!==r.g?' · '+esc(r.o):''}<br><small>${Object.entries(r.d).map(([p,v])=>esc(p)+' '+fmt(v)).join(' · ')}</small></div>`).join('')||'<span class=mu>Vēl nav partiju.</span>'}${rs.length?`<button onclick="${u}">Atcelt pēdējo partiju</button>`:''}</div>`}

// ---- noteikumu redaktors ----
const rin=(r,open)=>`<div id=rw><details id=rd data-m="${r.mode||'MG'}" ${open?'open':''} class=card><summary><b>Punktu noteikumi</b> <small>· ${r.mode||'MG'}</small></summary>
<div class=lbl>Variants</div>${['MG','G','P'].map(m=>`<button class="${(r.mode||'MG')===m?'on':''}" onclick="rmode('${m}')">${m==='P'?'P (pulēm)':m}</button>`).join('')}
<div class=lbl>Katrs pretinieks saņem (pretēja zīme)</div><select id=ro><option value="0.5" ${r.opp==0.5?'selected':''}>pusi no spēlētāja punktiem</option><option value="1" ${r.opp==1?'selected':''}>visus spēlētāja punktus</option></select>
${Object.keys(r.games).map(n=>`<div class=lbl>${esc(n)}</div>${r.games[n].map(o=>`<div class=bar><span style="flex:1">${esc(o[0])}</span><input class=rp style="width:90px" type=number step=any inputmode=decimal data-g="${esc(n)}" data-l="${esc(o[0])}" value="${o[1]}"></div>`).join('')}`).join('')}
<div class=lbl>Pievienot spēli (viena rindā, piem.  Super: Uzvara=10, Zaudējums=-8)</div><textarea id=rx rows=2></textarea>
<small>Vienreizējiem punktiem partijā izvēlies „Cits”.</small></details></div>`;
function rmode(m){const r=JSON.parse(JSON.stringify(PRE[m]));r.mode=m;$('#rw').outerHTML=rin(r,true)}
function readRules(){const g={};document.querySelectorAll('.rp').forEach(e=>{const n=e.dataset.g;(g[n]=g[n]||[]).push([e.dataset.l,parseFloat(e.value)||0])});
 for(const line of ($('#rx').value||'').split('\n').map(x=>x.trim()).filter(Boolean)){const m=line.match(/^([^:]+):(.+)$/);const o=m&&m[2].split(',').map(x=>x.split('=')).map(a=>[(a[0]||'').trim(),parseFloat(a[1])]);
  if(!m||o.some(x=>!x[0]||isNaN(x[1]))){alert('Pievienotās spēles formāts:  Nosaukums: Uzvara=10, Zaudējums=-8');return null}g[m[1].trim()]=o}
 return {mode:$('#rd').dataset.m,opp:+$('#ro').value,games:g}}

// ---- sēdvietu secība (velkams saraksts) ----
let DG=null;
function orderEd(pl,fn){return `<details class=card><summary><b>Sēdvietu secība</b> <small>· velc ☰, lai samainītu</small></summary><div id=ol data-fn="${fn}">${pl.map((p,i)=>`<div class=ord data-i="${i}"><span class=hd onpointerdown="dgS(event,this)" onpointermove="dgM(event)" onpointerup="dgE()" onpointercancel="dgE()">☰</span> ${esc(p)}</div>`).join('')}</div><small>Dalītājs mainās šajā secībā.</small></details>`}
function dgS(e,h){DG=h.parentNode;DG.style.opacity=.6;h.setPointerCapture(e.pointerId)}
function dgM(e){if(!DG)return;const el=document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest&&el.closest('[data-i]');if(!r||r===DG||r.parentNode!==DG.parentNode)return;const b=r.getBoundingClientRect(),hz=r.parentNode.classList.contains('sb'),bf=hz?e.clientX<b.left+b.width/2:e.clientY<b.top+b.height/2;r.parentNode.insertBefore(DG,bf?r:r.nextSibling)}
function dgE(){if(!DG)return;DG.style.opacity=1;DG=null;const l=$('#ol');window[l.dataset.fn]([...l.children].map(x=>+x.dataset.i))}
function ordS(ix){solo.players=ix.map(i=>solo.players[i]);ls.set('solo',solo);render()}
function ordT(ix){const T=cfg.tables.map(t=>({...t}));T[tbl].players=ix.map(i=>cfg.tables[tbl].players[i]);db.doc("t/cfg").set({...cfg,tables:T}).catch(e=>alert('Neizdevās: '+e.message))}

// ---- partijas ievade ----
let saver=null;
function autoDl(pl,rs){if(pl.length<4)return -1;for(let k=rs.length-1;k>=0;k--){if(rs[k].dl){const i=pl.indexOf(rs[k].dl);if(i>=0)return (i+1)%pl.length}}return 0}
function hand(pl,sv,rs){saver=sv;if(!H||H.pl.join('|')!==pl.join('|'))H={pl,dealer:autoDl(pl,rs||[]),chg:false,main:null,g:null,o:null,c:{}};H.rs=rs||[];
 const P=pl.filter((_,i)=>i!==H.dealer),d=deltas();
 const B=(on,k,v,l)=>`<button class="${on?'on':''}" onclick="hs('${k}',${v})">${esc(l)}</button>`;
 return `<div class=card><h3>Jauna partija</h3>${R().mode==='P'?`<div class=lbl>Pules uz galda: <b>${pool(H.rs)}</b></div>`:''}
${pl.length>3?`<div class=lbl>Dalītājs (nespēlē) <button onclick="H.chg=!H.chg;render()" style="min-height:0;padding:4px 10px">mainīt</button></div>${H.chg?pl.map((p,i)=>B(H.dealer===i,'dealer',i,p)).join(''):`<b>${esc(pl[H.dealer])}</b>`}`:''}
${!['Custom','Pule'].includes(H.g)?`<div class=lbl>${H.g==='Galdiņš'?'Kas zaudēja':'Kas spēlēja (lielais)'}</div>${P.map(p=>B(H.main===p,'main',pl.indexOf(p),p)).join('')}`:''}
<div class=lbl>Spēle</div>${Object.keys(GM()).map((g,i)=>B(H.g===g,'g',i,gl(g))).join('')}
${H.g&&!['Custom','Pule'].includes(H.g)?`<div class=lbl>Rezultāts</div>${GM()[H.g].map((o,i)=>B(H.o===i,'o',i,o[0]+' ('+fmt(o[1])+')')).join('')}`:''}
${H.g==='Custom'?`<div class=lbl>Punkti katram spēlētājam</div>${pl.map(p=>`<div class=bar><span style="flex:1">${esc(p)}</span><input style="width:110px" type=number step=any inputmode=decimal value="${H.c[p]??''}" oninput="H.c[${JSON.stringify(p).replace(/"/g,'&quot;')}]=this.value;upd()"></div>`).join('')}`:''}
<div class=lbl>Priekšskatījums</div><div id=pv>${pvH(d)}</div>
<button class=pri ${d?'':'disabled'} id=sv onclick="hsave()" style="width:100%;margin-top:8px">Saglabāt partiju</button></div>`}
function pvH(d){return d?Object.entries(d).map(([p,v])=>`${esc(p)} <b class="${v<0?'n':''}">${fmt(v)}</b>`).join(' · '):'<span class=mu>Aizpildi laukus augstāk</span>'}
function upd(){const d=deltas();$('#pv').innerHTML=pvH(d);$('#sv').disabled=!d}
function hs(k,v){if(!H){render();return}if(k==='dealer'){H.dealer=v;if(H.main===H.pl[v])H.main=null}else if(k==='main')H.main=H.pl[v];else if(k==='g'){H.g=Object.keys(GM())[v];H.o=null}else H.o=v;render()}
function deltas(){const pl=H.pl,n=pl.length,d={};H.plc=0;if(n>3&&H.dealer<0)return null;
 if(H.g==='Custom'){if(pl.every(p=>H.c[p]===undefined||H.c[p]===''))return null;pl.forEach(p=>d[p]=+H.c[p]||0);return d}
 if(H.g==='Pule'){pl.forEach(p=>d[p]=-1);H.plc=1;return d}
 if(!H.g||H.main==null||H.o==null)return null;const v=GM()[H.g][H.o][1],o=R().opp;
 pl.forEach(p=>d[p]=p===H.main?v*o*(n-1):-v*o);
 if(R().mode==='P'&&H.g==='Lielais'&&pool(H.rs)>0){d[H.main]+=v>0?n:-n;H.plc=v>0?-1:1}
 return d}
function hsave(){if(!H)return render();const d=deltas();if(!d)return;window[saver]({t:Date.now(),dl:H.pl.length>3?H.pl[H.dealer]:undefined,g:H.g,o:(H.g==='Custom'||H.g==='Pule')?H.g:GM()[H.g][H.o][0],d,pl:H.plc||undefined})}
render();
</script></body></html>
